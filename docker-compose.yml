services:
  db:
    container_name: weatherapp-db
    image: bulawesley/db:v1
    platform: linux/amd64
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - weatherapp
    restart: always

  redis:
    container_name: weatherapp-redis
    image: bulawesley/redis:v1
    platform: linux/amd64
    env_file:
      - .env
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - weatherapp
    restart: always

  weather:
    container_name: weatherapp-weather
    build:
      context: ./weather-service
    env_file:
      - .env
    environment:
      APIKEY: ${WEATHER_API_KEY}
    expose:
      - "5000"
    networks:
      - weatherapp
    restart: always
    depends_on:
      - db
      - redis

  auth:
    container_name: weatherapp-auth
    image: bulawesley/auth:v1
    platform: linux/amd64
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    expose:
      - "8080"
    networks:
      - weatherapp
    restart: always
    depends_on:
      - weather

  ui:
    container_name: weatherapp-ui
    image: bulawesley/ui:v1
    platform: linux/amd64
    env_file:
      - .env
    environment:
      AUTH_HOST: ${AUTH_HOST:-auth}
      AUTH_PORT: ${AUTH_PORT:-8080}
      WEATHER_HOST: ${WEATHER_HOST:-weather}
      WEATHER_PORT: ${WEATHER_PORT:-5000}
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./overrides/ui-index.js:/usr/src/app/public/static/index.js:ro
    expose:
      - "3000"
    ports:
      - "${UI_PORT:-3000}:3000"
    networks:
      - weatherapp
    restart: always
    depends_on:
      - auth

networks:
  weatherapp:

volumes:
  db-data:
  redis-data:
